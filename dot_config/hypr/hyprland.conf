# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-2,2560x1440@270,1440x800,1,vrr,2
monitor=HDMI-A-1,2560x1440@60,0x0,1,transform,3

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = thunar
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = hyprpaper
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = waybar
exec-once = dunst
exec-once=hyprctl setcursor MyCursor 24


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
# env = HYPRCURSOR_THEME,rose-pine-hyprcursor
# env = HYPRCURSOR_SIZE,24
# env = GDK_BACKEND,wayland,x11,*
# env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# env = QT_QPA_PLATFORMTHEME,qt5ct

source = /home/alex/.config/hypr/hyprland-colors.conf 

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 2
    gaps_out = 5
    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)
    col.active_border = $color4 $color11 45deg
    col.inactive_border = rgba(595959aa)
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true
    layout = master
}
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = false

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    # drop_shadow = true
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
  mfact = 0.5
    new_status = slave
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    # no_direct_scanout = false
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

cursor{
    inactive_timeout= 5
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    follow_mouse = 1
    sensitivity = -1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
    scroll_factor = 1
}

device {
   name = fnatic-gear-fnatic-gear-streak60-keyboard
    kb_layout = us_qwertz,de
    kb_options = caps:escape
}

device {
   name = moergo-go60-left-keyboard
    kb_layout = us_qwertz,de
}

# device{
#   name = razer-razer-blackwidow-tournament-edition-chroma
#   kb_layout = us_qwertz,de
#   kb_options = caps:escape
# }

device {
    name = dualsense-wireless-controller-touchpad
    sensitivity = 5
}

ecosystem {
	no_update_news = true
	no_donation_nag = true
}

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
# bind = $mainMod, F, togglefloating,
bind = $mainMod, F, fullscreen,
bind = ALT, Space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = CTRL, h, movefocus, l
bind = CTRL, l, movefocus, r
bind = CTRL, k, movefocus, u
bind = CTRL, j, movefocus, d

bind = CTRL SHIFT, h, movewindow, l
bind = CTRL SHIFT, l, movewindow, r
bind = CTRL SHIFT, k, movewindow, u
bind = CTRL SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
%bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Type text currently in paste
bind = ALT, V, exec, wtype "$(wl-paste)"

# Screenshot a selection and copy text to clipboard
bind = ,PRINT, exec, grim -g "$(slurp)" - | tesseract - - | wl-copy
bind = $mainMod, PRINT, exec, hyprshot -m region

# Clipboard history
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Reload Waybar configuration
bind = $mainMod, W, exec, pkill -SIGUSR2 waybar

# Media controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioPlay, exec, curl -sf http://localhost:32500/player/playback/playPause || playerctl play-pause
bindel = , XF86AudioNext, exec, curl -sf http://localhost:32500/player/playback/skipNext || playerctl next
bindel = , XF86AudioPrev, exec, curl -sf http://localhost:32500/player/playback/skipPrevious || playerctl previous
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, name:coding, rounding:false, decorate:false, gapsin:0, gapsout:0, border:false, monitor:DP-1, persistent:true, default = true,
workspace = 2, monitor:DP-1,name:Browser, persistent:true,
workspace = 3, name:coding-bg, rounding:false, decorate:false, gapsin:0, gapsout:0, monitor:DP-1, border:false, persistent:true,
workspace = 4, monitor:DP-1,persistent:true,
workspace = 5, monitor:DP-1,persistent:true,
workspace = 6, monitor:HDMI-A-1, persistent:true, default:true,
workspace = 7, monitor:HDMI-A-1,persistent:true,
workspace = 8, monitor:HDMI-A-1,persistent:true,
workspace = 9, monitor:HDMI-A-1,persistent:true,
workspace = 10, monitor:HDMI-A-1,persistent:true,

windowrule = match:class audacious, workspace 7 silent
windowrule = match:class Plexamp, workspace 7 silent
windowrule = match:title ^(Open File|Select a File|Open Folder|Save As|Library|File Upload)(.*)$, float on, center on
# flot misc
windowrule = match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|Zotero|nwg-look)$, float on ,center on, size 45%
windowrule = match:class TeamSpeak 3, float true, workspace 6 silent
windowrule = match:class firefox, workspace 2
windowrule = match:class ^([Ss]team)$, workspace 3 silent
windowrule = match:title Friends List, float true
windowrule = match:title Deadlock, immediate true, workspace 4, fullscreen true
windowrule = match:title .*Binding of Isaac.*, immediate true, workspace 4, fullscreen true
windowrule = match:title Steam Big Picture Mode, immediate true
windowrule = match:title Hollow Knight, immediate true
windowrule = match:title Hollow Knight Silksong, immediate true
windowrule = match:title ANIMAL WELL, immediate true
windowrule = match:title Celeste, immediate true
windowrule = match:title Detroit: Become Human, immediate true
windowrule = match:title Plex, workspace 5, fullscreen true
windowrule = match:class mpv, workspace 4, fullscreen true

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

exec-once = hyprctl dispatch workspace 1
exec-once = ghostty
